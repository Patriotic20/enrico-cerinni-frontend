# Nginx config for the frontend container itself.
#
# The bundle calls the API on the same origin (/api/*), so whatever serves the
# static files must also forward /api to the backend. Without that, opening the
# published port directly returns index.html for API calls and the app reports
# "Noto'g'ri javob formati".

server {
    listen 3000;
    listen [::]:3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Strip the /api prefix and forward to FastAPI, same as the reverse proxy does.
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Vite fingerprints asset filenames, so they can be cached indefinitely.
        # One header only — "expires" plus "add_header Cache-Control" emits two.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes must resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
