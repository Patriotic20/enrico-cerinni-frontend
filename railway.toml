[build]
builder = "NIXPACKS"
# --include=dev is required: if NODE_ENV=production is set in the service
# variables, npm would otherwise skip devDependencies, and vite lives there.
buildCommand = "npm ci --include=dev && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Service variables (set them in Railway → Variables, not here):
#   VITE_API_URL — inlined by Vite during the build, so a change needs a redeploy.
